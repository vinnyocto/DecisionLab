<!DOCTYPE html>
<html>
<head>
    <title>Coin Flip Simulator</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 34px;
        }

        p {
            color: #4b5563;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 24px;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="navbar">DecisionLab</div>

<div class="container">
    <div class="card">
        <h1>Coin Flip Betting Simulator</h1>
        <p>Test how repeated coin-flip bets affect your bankroll over time.</p>

        <form method="POST">
            <label>Number of Trials</label>
            <input name="trials" type="number" placeholder="Example: 100" required>

            <label>Starting Money</label>
            <input name="money" type="number" placeholder="Example: 1000" required>

            <label>Bet Per Round</label>
            <input name="bet" type="number" placeholder="Example: 10" required>

            <button type="submit">Run Simulation</button>
        </form>

        <a class="back" href="/dashboard">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
